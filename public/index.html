<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarketHub - Buy & Sell Worldwide</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fas fa-store"></i>
                <span>MarketHub</span>
            </div>
            
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            
            <div class="nav-links">
                <a href="#" id="homeLink">Home</a>
                <a href="#" id="sellLink">Sell</a>
                <a href="#" id="messagesLink">Messages</a>
                <a href="#" id="myProductsLink">My Items</a>
                
                <div id="authLinks">
                    <button id="loginBtn">Login</button>
                    <button id="registerBtn">Sign Up</button>
                </div>
                
                <div id="userMenu" style="display: none;">
                    <span id="userName"></span>
                    <button id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="hero-section">
        <h1>Buy & Sell Anywhere in the World</h1>
        <p>Join thousands of buyers and sellers globally</p>
        <button id="heroSellBtn">Start Selling</button>
        <button id="heroBrowseBtn">Browse Products</button>
    </div>

    <!-- Products Grid -->
    <div class="container">
        <div id="productsView">
            <div class="products-grid" id="productsGrid"></div>
        </div>

        <!-- Sell Form -->
        <div id="sellView" style="display: none;">
            <h2>List Your Product</h2>
            <form id="sellForm" enctype="multipart/form-data">
                <input type="text" name="title" placeholder="Product Title" required>
                <textarea name="description" placeholder="Description" required></textarea>
                <input type="number" name="price" placeholder="Price" required>
                <select name="category" required>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="home">Home</option>
                </select>
                <select name="condition" required>
                    <option value="new">New</option>
                    <option value="used">Used</option>
                </select>
                <input type="file" name="images" multiple accept="image/*" required>
                <button type="submit">List Product</button>
            </form>
        </div>

        <!-- Messages -->
        <div id="messagesView" style="display: none;">
            <div class="chat-container">
                <div id="chatsList"></div>
                <div id="chatArea">
                    <div id="chatMessages"></div>
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button id="sendMessageBtn">Send</button>
                </div>
            </div>
        </div>

        <!-- My Products -->
        <div id="myProductsView" style="display: none;">
            <h2>My Products</h2>
            <div id="myProductsGrid"></div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            <p>Don't have an account? <a href="#" id="switchToRegister">Sign Up</a></p>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create Account</h2>
            <form id="registerForm">
                <input type="text" id="regFullName" placeholder="Full Name" required>
                <input type="text" id="regUsername" placeholder="Username" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Password" required>
                <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>
                <button type="submit">Create Account</button>
            </form>
            <p>Already have an account? <a href="#" id="switchToLogin">Login</a></p>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Reset Password</h2>
            <form id="forgotPasswordForm">
                <input type="email" id="resetEmail" placeholder="Your Email" required>
                <button type="submit">Send Reset Link</button>
            </form>
            <a href="#" id="backToLogin">Back to Login</a>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" style="display: none; position: fixed; bottom: 20px; right: 20px; background: green; color: white; padding: 10px; border-radius: 5px;"></div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
